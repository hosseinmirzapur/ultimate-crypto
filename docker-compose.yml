version: "3.9"

services:
  pulse-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro
    env_file:
      - .env
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: pulse-influxdb
    ports:
      - "8086:8086"
    volumes:
      - hermes_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=hermes
      - DOCKER_INFLUXDB_INIT_BUCKET=market-data
      - DOCKER_INFLUXDB_INIT_RETENTION=90d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  pulse-web:
    image: nginx:alpine
    container_name: pulse-web
    ports:
      - "80:80"
    volumes:
      - ./src/pulse/dashboard/static:/usr/share/nginx/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pulse-api:
        condition: service_healthy

volumes:
  hermes_data:
